          STEP1_VAR: I_AM_STEP1_SCOPED
      run: |
        echo "workflow_var: ${{ env.workflow_var }}"
        echo "job1_var: ${{ env.job1_var }}"
        echo "STEP1_VAR: ${{ env.STEP1_VAR }}"


  job2:
    runs-on: ubuntu-22.04
